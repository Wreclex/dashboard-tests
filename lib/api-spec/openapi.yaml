openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: telegram
    description: Telegram channel management and message delivery
  - name: sheets
    description: Google Sheets data sync
  - name: auto-reports
    description: Scheduled Telegram report delivery
  - name: mango
    description: Mango Office KPI synchronization
  - name: moizvonki
    description: Мои Звонки (moizvonki.ru) call dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sheets/counts:
    get:
      operationId: getSheetCounts
      tags: [sheets]
      summary: Count today's touches per metric from Google Sheets
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Manager name to filter by (column K). Normalized match — spaces and case ignored.
      responses:
        "200":
          description: Today's metric counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetCounts"
        "401":
          description: Unauthorized
        "502":
          description: Google Sheets API error

  /telegram/channels:
    get:
      operationId: listTelegramChannels
      tags: [telegram]
      summary: List the authenticated user's Telegram channels
      responses:
        "200":
          description: List of channels (bot tokens are never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized
    post:
      operationId: createTelegramChannel
      tags: [telegram]
      summary: Add a new Telegram channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChannelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized

  /telegram/channels/{id}:
    put:
      operationId: updateTelegramChannel
      tags: [telegram]
      summary: Update a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChannelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteTelegramChannel
      tags: [telegram]
      summary: Delete a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /telegram/send:
    post:
      operationId: sendTelegramMessage
      tags: [telegram]
      summary: Send a message to a channel via the server (bot token stays server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSendInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSendResult"
        "401":
          description: Unauthorized
        "404":
          description: Channel not found
        "502":
          description: Telegram API error

  /mango/status:
    get:
      operationId: getMangoStatus
      tags: [mango]
      summary: Get Mango Office connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoStatus"
        "401":
          description: Unauthorized

  /mango/credentials:
    put:
      operationId: putMangoCredentials
      tags: [mango]
      summary: Store the authenticated user's Mango Office login (email + password)
      description: Verifies credentials via headless-browser login before saving. May take up to ~60s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangoCredentialsInput"
      responses:
        "204":
          description: Credentials verified and stored
        "400":
          description: Missing email or password
        "401":
          description: Mango rejected the credentials (auth_failed) or user unauthorized
        "502":
          description: Headless login failed (captcha/2FA/network)
    delete:
      operationId: deleteMangoCredentials
      tags: [mango]
      summary: Remove the authenticated user's Mango Office credentials
      responses:
        "204":
          description: Credentials removed
        "401":
          description: Unauthorized

  /mango/token:
    put:
      operationId: putMangoToken
      tags: [mango]
      summary: Store the Mango jwt_token and operator groups pasted from the user's own browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangoTokenInput"
      responses:
        "204":
          description: Tokens stored
        "400":
          description: Missing token
        "401":
          description: Unauthorized

  /mango/kpi:
    get:
      operationId: getMangoKpi
      tags: [mango]
      summary: Fetch today's Mango Office calls and traffic duration
      responses:
        "200":
          description: Today's KPI values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoKpi"
        "401":
          description: Unauthorized or expired Mango token
        "404":
          description: Mango token is not configured
        "502":
          description: Mango Office could not provide KPI data

  /moizvonki/status:
    get:
      operationId: getMoizvonkiStatus
      tags: [moizvonki]
      summary: Get Мои Звонки connection status and last collection result
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiStatus"

  /moizvonki/session:
    put:
      operationId: putMoizvonkiSession
      tags: [moizvonki]
      summary: Store cookies + internal report URL copied from the user's browser (Variant A)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiSessionInput"
      responses:
        "204":
          description: Session stored
        "400":
          description: Missing cookies or report URL

  /moizvonki/credentials:
    put:
      operationId: putMoizvonkiCredentials
      tags: [moizvonki]
      summary: Store Мои Звонки login + password for automatic headless-browser sign-in (Variant B)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiCredentialsInput"
      responses:
        "204":
          description: Credentials stored
        "400":
          description: Missing login or password
    delete:
      operationId: deleteMoizvonkiConnection
      tags: [moizvonki]
      summary: Remove all stored Мои Звонки connection data (cookies, URL, login, password)
      responses:
        "204":
          description: Connection data removed

  /moizvonki/metrics:
    get:
      operationId: getMoizvonkiMetrics
      tags: [moizvonki]
      summary: Get today's stored call metrics (traffic, calls, density)
      responses:
        "200":
          description: Today's metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "404":
          description: No metrics collected yet today

  /moizvonki/refresh:
    post:
      operationId: refreshMoizvonkiMetrics
      tags: [moizvonki]
      summary: Force data collection from ЛК «Мои Звонки» (cookies first, headless browser fallback)
      responses:
        "200":
          description: Freshly collected metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "400":
          description: No connection configured (neither cookies nor login/password)
        "401":
          description: Мои Звонки rejected the stored session — re-configure
        "502":
          description: Collection failed (network, changed markup, timeout)

  /moizvonki/upload-csv:
    post:
      operationId: uploadMoizvonkiCsv
      tags: [moizvonki]
      summary: Manual CSV upload fallback — parses call duration and count from an exported report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiCsvInput"
      responses:
        "200":
          description: Parsed metrics, stored for the given date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "400":
          description: CSV could not be parsed (no duration/calls columns found)

  /moizvonki/history:
    get:
      operationId: getMoizvonkiHistory
      tags: [moizvonki]
      summary: Daily metrics history for the trend chart (last 30 days)
      responses:
        "200":
          description: History entries ordered by date ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoizvonkiHistoryEntry"

  /moizvonki/settings:
    get:
      operationId: getMoizvonkiSettings
      tags: [moizvonki]
      summary: Get dashboard settings (shift duration, refresh interval)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiSettings"
    put:
      operationId: putMoizvonkiSettings
      tags: [moizvonki]
      summary: Save dashboard settings (shift duration, refresh interval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiSettingsInput"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiSettings"
        "400":
          description: Invalid values

  /state:
    post:
      operationId: saveUserReportState
      tags: [auto-reports]
      summary: Save the authenticated user's current report state for scheduled delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserReportStateInput"
      responses:
        "204":
          description: State saved
        "401":
          description: Unauthorized

  /auto-reports:
    get:
      operationId: getAutoReportSchedule
      tags: [auto-reports]
      summary: Get the authenticated user's scheduled report configuration
      responses:
        "200":
          description: Current schedule, or null if it has not been configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutoReportSchedule"
                  - type: "null"
        "401":
          description: Unauthorized
    post:
      operationId: createAutoReportSchedule
      tags: [auto-reports]
      summary: Create or activate the authenticated user's scheduled report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoReportScheduleInput"
      responses:
        "200":
          description: Schedule saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoReportSchedule"
        "400":
          description: Invalid input or channel
        "401":
          description: Unauthorized
    patch:
      operationId: updateAutoReportSchedule
      tags: [auto-reports]
      summary: Update the authenticated user's scheduled report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoReportScheduleUpdate"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoReportSchedule"
        "401":
          description: Unauthorized
        "404":
          description: Schedule not found
    delete:
      operationId: deleteAutoReportSchedule
      tags: [auto-reports]
      summary: Deactivate the authenticated user's scheduled report
      responses:
        "204":
          description: Schedule deactivated
        "401":
          description: Unauthorized
        "404":
          description: Schedule not found


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SheetCounts:
      type: object
      properties:
        pzm:
          type: number
        psm:
          type: number
        pstl:
          type: number
        vstl:
          type: number
        dozh:
          type: number
        date:
          type: string
      required:
        - pzm
        - psm
        - pstl
        - vstl
        - dozh
        - date

    TelegramChannel:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        chatId:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - chatId
        - createdAt

    TelegramChannelInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        chatId:
          type: string
          minLength: 1
        botToken:
          type: string
          minLength: 1
      required:
        - name
        - chatId
        - botToken

    TelegramChannelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        chatId:
          type: string
          minLength: 1
        botToken:
          type: string

    TelegramSendInput:
      type: object
      properties:
        channelId:
          type: number
        text:
          type: string
          minLength: 1
      required:
        - channelId
        - text

    TelegramSendResult:
      type: object
      properties:
        ok:
          type: boolean
        messageId:
          type: ["number", "null"]
      required:
        - ok

    MangoTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: RS256 jwt_token from the CCC session localStorage
        groups:
          type: string
          description: Operator group IDs as JSON array or CSV (localStorage <member_id>.operator_groups)
      required: [token]

    MangoCredentialsInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [email, password]

    MangoStatus:
      type: object
      properties:
        isConnected:
          type: boolean
      required: [isConnected]

    MangoKpi:
      type: object
      properties:
        calls:
          type: number
          minimum: 0
        trafficSeconds:
          type: number
          minimum: 0
      required: [calls, trafficSeconds]

    ReportStateData:
      type: object
      properties:
        pzm: { type: number, minimum: 0 }
        psm: { type: number, minimum: 0 }
        pstl: { type: number, minimum: 0 }
        vstl: { type: number, minimum: 0 }
        dozh: { type: number, minimum: 0 }
        trafikPlan: { type: string }
        trafikCurrent: { type: string }
        kz: { type: number, minimum: 0 }
        prihod: { type: string }
        uhod: { type: string }
        postupleniya: { type: number, minimum: 0 }
        itogoFact: { type: number, minimum: 0 }
        itogoPlan: { type: number, minimum: 0 }
        vypolnenie: { type: number, minimum: 0 }
        financesEnabled: { type: boolean }
      required: [pzm, psm, pstl, vstl, dozh, trafikPlan, trafikCurrent, kz, prihod, uhod, postupleniya, itogoFact, itogoPlan, vypolnenie, financesEnabled]

    ReportSignature:
      type: object
      properties:
        tag1: { type: string, minLength: 1 }
        tag2: { type: string, minLength: 1 }
        mention: { type: string, minLength: 1 }
      required: [tag1, tag2, mention]

    UserReportStateInput:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/ReportStateData"
        signature:
          $ref: "#/components/schemas/ReportSignature"
      required: [state, signature]

    AutoReportScheduleInput:
      type: object
      properties:
        channelId: { type: number, minimum: 1 }
        intervalMinutes: { type: number, minimum: 1, maximum: 10 }
        reportType: { type: number, minimum: 0, maximum: 2 }
        isActive: { type: boolean }
      required: [channelId, intervalMinutes, reportType, isActive]

    AutoReportScheduleUpdate:
      type: object
      properties:
        channelId: { type: number, minimum: 1 }
        intervalMinutes: { type: number, minimum: 1, maximum: 10 }
        reportType: { type: number, minimum: 0, maximum: 2 }
        isActive: { type: boolean }

    AutoReportSchedule:
      type: object
      properties:
        id: { type: number }
        channelId: { type: number }
        intervalMinutes: { type: number }
        reportType: { type: number }
        isActive: { type: boolean }
        lastSentAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, channelId, intervalMinutes, reportType, isActive, lastSentAt, createdAt, updatedAt]

    MoizvonkiStatus:
      type: object
      properties:
        isConfigured:
          type: boolean
        hasCookies:
          type: boolean
        hasCredentials:
          type: boolean
        lastFetchAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        lastSource:
          type: ["string", "null"]
          description: How the last successful data point was collected — "http" (cookies), "browser" (headless), "csv" (manual upload)
      required: [isConfigured, hasCookies, hasCredentials, lastFetchAt, lastError, lastSource]

    MoizvonkiSessionInput:
      type: object
      properties:
        cookies:
          type: string
          minLength: 1
          description: Cookie header value copied from DevTools
        reportUrl:
          type: string
          minLength: 1
          description: Internal request URL that returns the report data
        headers:
          type: string
          description: Optional extra headers as JSON object string
      required: [cookies, reportUrl]

    MoizvonkiCredentialsInput:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [login, password]

    MoizvonkiMetrics:
      type: object
      properties:
        date:
          type: string
          description: Day the metrics belong to (DD.MM.YYYY)
        calls:
          type: number
          minimum: 0
        trafficSeconds:
          type: number
          minimum: 0
        shiftHours:
          type: number
          minimum: 0
        density:
          type: number
          minimum: 0
          description: calls / shiftHours
        source:
          type: string
          description: "http | browser | csv"
        updatedAt:
          type: string
          format: date-time
      required: [date, calls, trafficSeconds, shiftHours, density, source, updatedAt]

    MoizvonkiCsvInput:
      type: object
      properties:
        csv:
          type: string
          minLength: 1
          description: Raw CSV file content (any common delimiter)
        date:
          type: string
          description: Optional day override in DD.MM.YYYY; defaults to today
      required: [csv]

    MoizvonkiHistoryEntry:
      type: object
      properties:
        date:
          type: string
        calls:
          type: number
          minimum: 0
        trafficSeconds:
          type: number
          minimum: 0
        density:
          type: number
          minimum: 0
      required: [date, calls, trafficSeconds, density]

    MoizvonkiSettings:
      type: object
      properties:
        shiftHours:
          type: number
          minimum: 0.5
          maximum: 24
        refreshIntervalMinutes:
          type: number
          minimum: 1
          maximum: 240
      required: [shiftHours, refreshIntervalMinutes]

    MoizvonkiSettingsInput:
      type: object
      properties:
        shiftHours:
          type: number
          minimum: 0.5
          maximum: 24
        refreshIntervalMinutes:
          type: number
          minimum: 1
          maximum: 240
