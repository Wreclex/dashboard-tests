openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: telegram
    description: Telegram channel management and message delivery
  - name: sheets
    description: Google Sheets data sync
  - name: auto-reports
    description: Scheduled Telegram report delivery
  - name: mango
    description: Mango Office KPI synchronization
  - name: moizvonki
    description: Мои Звонки (moizvonki.ru) call dashboard
  - name: team
    description: Unified user profile and team roles (shared by Report Tool and the call dashboard)
  - name: admin
    description: User administration (admin role only)
paths:
  /me:
    get:
      operationId: getMe
      tags: [team]
      summary: Get the authenticated user's profile and role
      description: |
        Registers the user on first call (default role "employee"; the very
        first registered user becomes "admin" and claims the legacy
        single-user dashboard data). Shared by both apps.
      responses:
        "200":
          description: Profile and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all registered users (admin only)
      responses:
        "200":
          description: All team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized
        "403":
          description: Admin role required

  /admin/users/{clerkUserId}:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Change a user's role (admin only)
      description: An administrator cannot change their own role.
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid role or attempt to change own role
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: User not found

  /admin/users/{clerkUserId}/operator:
    patch:
      operationId: updateAdminUserOperator
      tags: [admin]
      summary: Assign or clear a Mango Office operator for a team member (admin only)
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberOperatorUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid or unavailable Mango operator
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: User not found
        "409":
          description: Operator is already assigned

  /admin/invitations:
    get:
      operationId: listAdminInvitations
      tags: [admin]
      summary: List team invitations (admin only)
      responses:
        "200":
          description: Team invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvitation"
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
    post:
      operationId: createAdminInvitation
      tags: [admin]
      summary: Pre-assign a role to an email address; applied when that person first signs in (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInvitationInput"
      responses:
        "201":
          description: Created role assignment for the invited email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
        "400":
          description: Invalid email or role
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "409":
          description: Person is already registered

  /admin/invitations/{id}:
    delete:
      operationId: deleteAdminInvitation
      tags: [admin]
      summary: Revoke a pending team invitation (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: Pending invitation not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sheets/counts:
    get:
      operationId: getSheetCounts
      tags: [sheets]
      summary: Count today's touches per metric from Google Sheets
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Manager name to filter by (column K). Normalized match — spaces and case ignored.
      responses:
        "200":
          description: Today's metric counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetCounts"
        "401":
          description: Unauthorized
        "502":
          description: Google Sheets API error

  /telegram/channels:
    get:
      operationId: listTelegramChannels
      tags: [telegram]
      summary: List the authenticated user's Telegram channels
      responses:
        "200":
          description: List of channels (bot tokens are never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized
    post:
      operationId: createTelegramChannel
      tags: [telegram]
      summary: Add a new Telegram channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChannelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized

  /telegram/channels/{id}:
    put:
      operationId: updateTelegramChannel
      tags: [telegram]
      summary: Update a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChannelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChannel"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteTelegramChannel
      tags: [telegram]
      summary: Delete a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /telegram/send:
    post:
      operationId: sendTelegramMessage
      tags: [telegram]
      summary: Send a message to a channel via the server (bot token stays server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSendInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSendResult"
        "401":
          description: Unauthorized
        "404":
          description: Channel not found
        "502":
          description: Telegram API error

  /mango/status:
    get:
      operationId: getMangoStatus
      tags: [mango]
      summary: Get Mango Office connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoStatus"
        "401":
          description: Unauthorized

  /mango/credentials:
    put:
      operationId: putMangoCredentials
      tags: [mango]
      summary: Store the authenticated user's Mango Office login (email + password)
      description: Verifies credentials via headless-browser login before saving. May take up to ~60s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangoCredentialsInput"
      responses:
        "204":
          description: Credentials verified and stored
        "400":
          description: Missing email or password
        "401":
          description: Mango rejected the credentials (auth_failed) or user unauthorized
        "502":
          description: Headless login failed (captcha/2FA/network)
    delete:
      operationId: deleteMangoCredentials
      tags: [mango]
      summary: Remove the authenticated user's Mango Office credentials
      responses:
        "204":
          description: Credentials removed
        "401":
          description: Unauthorized

  /mango/token:
    put:
      operationId: putMangoToken
      tags: [mango]
      summary: Store the Mango jwt_token and operator groups pasted from the user's own browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangoTokenInput"
      responses:
        "204":
          description: Tokens stored
        "400":
          description: Missing token
        "401":
          description: Unauthorized

  /mango/kpi:
    get:
      operationId: getMangoKpi
      tags: [mango]
      summary: Today's Mango Office calls and traffic duration for this user's own connection
      description: >-
        Answers from the stored snapshot and refreshes Mango in the background,
        so the request never waits on the (slow) Mango round trip. `state`
        describes the connection; `hasData` tells whether the numbers are real
        or placeholders.
      responses:
        "200":
          description: Snapshot of today's KPI plus connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoKpiSnapshot"
        "401":
          description: Unauthorized

  /moizvonki/mango/status:
    get:
      operationId: getMoizvonkiMangoStatus
      tags: [moizvonki]
      summary: Get the shared Mango Office connection status for the combined dashboard
      description: The dashboard uses ONE shared Mango connection (configured by admin/manager) for the whole team.
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoStatus"
        "401":
          description: Unauthorized

  /moizvonki/mango/kpi:
    get:
      operationId: getMoizvonkiMangoKpi
      tags: [moizvonki]
      summary: Today's Mango calls and traffic for the current user's claimed operator
      description: >-
        Answers from the stored snapshot and refreshes Mango in the background,
        so the request never waits on the (slow) Mango round trip. `state`
        describes the shared connection; `hasData` tells whether the numbers
        are real or placeholders.
      responses:
        "200":
          description: Snapshot of today's Mango KPI plus connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoKpiSnapshot"
        "401":
          description: Unauthorized
        "502":
          description: Mango Office could not provide KPI data

  /moizvonki/mango/operators:
    get:
      operationId: getMoizvonkiMangoOperators
      tags: [moizvonki]
      summary: List Mango Office operator names from the shared connection (for onboarding)
      responses:
        "200":
          description: Operator identifiers and names only; team KPI is manager/admin-only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MangoOperatorChoice"
        "401":
          description: Unauthorized or Mango session expired
        "404":
          description: Mango credentials are not configured
        "502":
          description: Mango Office could not provide the operator list

  /moizvonki/me/claim-operator:
    post:
      operationId: claimMoizvonkiOperator
      tags: [moizvonki]
      summary: Bind the current user to their Mango Office operator (chosen by name at first login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimOperatorBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Missing fields or unknown Mango operator
        "409":
          description: Operator is already claimed by another user
        "401":
          description: Unauthorized

  /moizvonki/team/kpi:
    get:
      operationId: getMoizvonkiTeamKpi
      tags: [moizvonki]
      summary: Team-wide Mango KPI for today — one row per operator plus totals (manager/admin only)
      responses:
        "200":
          description: Per-operator KPI and team totals from the stored snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoTeamKpi"
        "401":
          description: Unauthorized
        "403":
          description: Manager or admin role required

  /moizvonki/mango/reconnect:
    post:
      operationId: reconnectMoizvonkiMango
      tags: [moizvonki]
      summary: Re-establish the shared Mango session with the stored login (manager/admin only)
      description: >-
        Starts a fresh Mango login in the background and waits a few seconds for
        it, then reports the resulting connection state. Never blocks longer
        than that grace period.
      responses:
        "200":
          description: Connection state after the reconnect attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangoStatus"
        "401":
          description: Unauthorized
        "403":
          description: Manager or admin role required
        "404":
          description: Mango credentials are not configured

  /moizvonki/mango/credentials:
    put:
      operationId: putMoizvonkiMangoCredentials
      tags: [moizvonki]
      summary: Store the shared Mango Office login (email + password) for the dashboard (manager/admin only)
      description: Verifies credentials via headless-browser login before saving. May take up to ~60s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangoCredentialsInput"
      responses:
        "204":
          description: Credentials verified and stored
        "400":
          description: Missing email or password
        "401":
          description: Mango rejected the credentials
        "403":
          description: Manager or admin role required
        "502":
          description: Headless login failed (captcha/2FA/network)
    delete:
      operationId: deleteMoizvonkiMangoCredentials
      tags: [moizvonki]
      summary: Remove the shared Mango Office credentials (manager/admin only)
      responses:
        "204":
          description: Credentials removed
        "401":
          description: Unauthorized
        "403":
          description: Manager or admin role required

  /moizvonki/status:
    get:
      operationId: getMoizvonkiStatus
      tags: [moizvonki]
      summary: Get Мои Звонки connection status and last collection result
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiStatus"

  /moizvonki/session:
    put:
      operationId: putMoizvonkiSession
      tags: [moizvonki]
      summary: Store cookies + internal report URL copied from the user's browser (Variant A)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiSessionInput"
      responses:
        "204":
          description: Session stored
        "400":
          description: Missing cookies or report URL

  /moizvonki/credentials:
    put:
      operationId: putMoizvonkiCredentials
      tags: [moizvonki]
      summary: Store Мои Звонки login + password for automatic headless-browser sign-in (Variant B)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiCredentialsInput"
      responses:
        "204":
          description: Credentials stored
        "400":
          description: Missing login or password
    delete:
      operationId: deleteMoizvonkiConnection
      tags: [moizvonki]
      summary: Remove all stored Мои Звонки connection data (cookies, URL, login, password)
      responses:
        "204":
          description: Connection data removed

  /moizvonki/metrics:
    get:
      operationId: getMoizvonkiMetrics
      tags: [moizvonki]
      summary: Get today's stored call metrics (traffic, calls, density)
      responses:
        "200":
          description: Today's metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "404":
          description: No metrics collected yet today

  /moizvonki/refresh:
    post:
      operationId: refreshMoizvonkiMetrics
      tags: [moizvonki]
      summary: Force data collection from ЛК «Мои Звонки» (cookies first, headless browser fallback)
      responses:
        "200":
          description: Freshly collected metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "400":
          description: No connection configured (neither cookies nor login/password)
        "401":
          description: Мои Звонки rejected the stored session — re-configure
        "502":
          description: Collection failed (network, changed markup, timeout)

  /moizvonki/upload-csv:
    post:
      operationId: uploadMoizvonkiCsv
      tags: [moizvonki]
      summary: Manual CSV upload fallback — parses call duration and count from an exported report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiCsvInput"
      responses:
        "200":
          description: Parsed metrics, stored for the given date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiMetrics"
        "400":
          description: CSV could not be parsed (no duration/calls columns found)

  /moizvonki/history:
    get:
      operationId: getMoizvonkiHistory
      tags: [moizvonki]
      summary: Daily metrics history for the trend chart (last 30 days)
      responses:
        "200":
          description: History entries ordered by date ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoizvonkiHistoryEntry"

  /moizvonki/settings:
    get:
      operationId: getMoizvonkiSettings
      tags: [moizvonki]
      summary: Get dashboard settings (shift duration, refresh interval)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiSettings"
    put:
      operationId: putMoizvonkiSettings
      tags: [moizvonki]
      summary: Save dashboard settings (shift duration, refresh interval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoizvonkiSettingsInput"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoizvonkiSettings"
        "400":
          description: Invalid values

  /state:
    post:
      operationId: saveUserReportState
      tags: [auto-reports]
      summary: Save the authenticated user's current report state for scheduled delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserReportStateInput"
      responses:
        "204":
          description: State saved
        "401":
          description: Unauthorized

  /auto-reports:
    get:
      operationId: getAutoReportSchedule
      tags: [auto-reports]
      summary: Get the authenticated user's scheduled report configuration
      responses:
        "200":
          description: Current schedule, or null if it has not been configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutoReportSchedule"
                  - type: "null"
        "401":
          description: Unauthorized
    post:
      operationId: createAutoReportSchedule
      tags: [auto-reports]
      summary: Create or activate the authenticated user's scheduled report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoReportScheduleInput"
      responses:
        "200":
          description: Schedule saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoReportSchedule"
        "400":
          description: Invalid input or channel
        "401":
          description: Unauthorized
    patch:
      operationId: updateAutoReportSchedule
      tags: [auto-reports]
      summary: Update the authenticated user's scheduled report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoReportScheduleUpdate"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoReportSchedule"
        "401":
          description: Unauthorized
        "404":
          description: Schedule not found
    delete:
      operationId: deleteAutoReportSchedule
      tags: [auto-reports]
      summary: Deactivate the authenticated user's scheduled report
      responses:
        "204":
          description: Schedule deactivated
        "401":
          description: Unauthorized
        "404":
          description: Schedule not found


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SheetCounts:
      type: object
      properties:
        pzm:
          type: number
        psm:
          type: number
        pstl:
          type: number
        vstl:
          type: number
        dozh:
          type: number
        date:
          type: string
      required:
        - pzm
        - psm
        - pstl
        - vstl
        - dozh
        - date

    TelegramChannel:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        chatId:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - chatId
        - createdAt

    TelegramChannelInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        chatId:
          type: string
          minLength: 1
        botToken:
          type: string
          minLength: 1
      required:
        - name
        - chatId
        - botToken

    TelegramChannelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        chatId:
          type: string
          minLength: 1
        botToken:
          type: string

    TelegramSendInput:
      type: object
      properties:
        channelId:
          type: number
        text:
          type: string
          minLength: 1
      required:
        - channelId
        - text

    TelegramSendResult:
      type: object
      properties:
        ok:
          type: boolean
        messageId:
          type: ["number", "null"]
      required:
        - ok

    MangoTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: RS256 jwt_token from the CCC session localStorage
        groups:
          type: string
          description: Operator group IDs as JSON array or CSV (localStorage <member_id>.operator_groups)
      required: [token]

    MangoCredentialsInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [email, password]

    MangoStatus:
      type: object
      properties:
        isConnected:
          type: boolean
        state:
          $ref: "#/components/schemas/MangoConnectionState"
        message:
          type: ["string", "null"]
          description: Reason behind a non-ok state, ready to show to the user.
        updatedAt:
          type: ["string", "null"]
          format: date-time
          description: When the cached Mango numbers were last refreshed.
      required: [isConnected, state, message, updatedAt]

    MangoConnectionState:
      type: string
      description: >-
        ok — data is current; refreshing — a background refresh is running;
        reauth_required — Mango rejected the stored login; unavailable — Mango
        could not be reached; not_configured — no shared connection yet;
        operator_not_claimed — the user has not picked their Mango operator.
      enum: [ok, refreshing, reauth_required, unavailable, not_configured, operator_not_claimed]

    MangoKpiSnapshot:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/MangoConnectionState"
        calls:
          type: number
          minimum: 0
        trafficSeconds:
          type: number
          minimum: 0
        hasData:
          type: boolean
          description: False when no snapshot exists yet — calls/traffic are placeholders.
        updatedAt:
          type: ["string", "null"]
          format: date-time
        message:
          type: ["string", "null"]
      required: [state, calls, trafficSeconds, hasData, updatedAt, message]

    MangoKpi:
      type: object
      properties:
        calls:
          type: number
          minimum: 0
        trafficSeconds:
